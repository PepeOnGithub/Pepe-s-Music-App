name: Compile Debug

on:
  push:
    branches:
      - main
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug build as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: Debug build (unsigned, no secrets required)
          body: Auto-updated on every push to main. Not signed with a stable key - reinstall (not update) if this replaces a previous install signed differently.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
