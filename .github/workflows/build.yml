name: Build APK
on:
  push:
    branches: [ci-builds, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: wrapper }
      - name: Signing key (same key as the app on the phone, so installs update in place)
        env: { KS: '${{ secrets.DEBUG_KEYSTORE_B64 }}' }
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore debug.keystore
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
